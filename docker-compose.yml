services:
  web-build:
    image: ${WEB_BUILD_IMAGE:-ghcr.io/qcabanes-hobby/fks-web-build:latest}
    build: ./frontend
    restart: "no"
    volumes:
      - web_dist:/dist
    networks:
      - fks_internal

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FKS_DOMAIN: ${FKS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/fks:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      web-build:
        condition: service_completed_successfully
    networks:
      - fks_internal

  api:
    image: ${API_IMAGE:-ghcr.io/qcabanes-hobby/fks-api:latest}
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://fks:${POSTGRES_PASSWORD}@db:5432/fks
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: mailto:${ADMIN_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fks_internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fks
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fks -d fks"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fks_internal

volumes:
  db_data:
  caddy_data:
  caddy_config:
  web_dist:

networks:
  fks_internal:
    driver: bridge
